# ════════════════════════════════════════════════════════════
#  PREXI UPEA — Stack de DESARROLLO local (NestJS + Next.js + Prisma)
#
#  Uso:
#    cp .env.docker.example .env   # JWT_SECRET, GEMINI_API_KEY
#    docker compose up --build
#
#  API:      http://localhost:4000/api/health
#  Web:      http://localhost:3000
#  Postgres: localhost:5433  (5432 lo usa tu Postgres local)
#
#  EJECUCIÓN DE PYTHON: ocurre en el NAVEGADOR del estudiante con Pyodide
#  (frontend/src/lib/python-runtime.ts + frontend/public/pyodide-worker.js).
#  No hay sandbox del lado del servidor, y por eso el sistema puede desplegarse
#  en plataformas gestionadas (Render/Vercel/Neon) sin necesitar un VPS ni
#  contenedores privilegiados.
#
#  PRODUCCIÓN: no se usa este archivo. Ver docs/DESPLIEGUE.md
# ════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16-alpine
    container_name: prexi-db
    restart: unless-stopped # vuelve solo tras reiniciar la máquina/Docker
    environment:
      POSTGRES_USER: prexi
      POSTGRES_PASSWORD: prexi
      POSTGRES_DB: prexi
    ports:
      - "5433:5432" # host 5433 → evita choque con el Postgres local del usuario
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prexi -d prexi"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── HERRAMIENTA OPCIONAL, no se levanta con `docker compose up` ──────────
  # Sandbox Piston. La ejecución del código del estudiante ya NO pasa por aquí
  # (corre en su navegador con Pyodide). Sobrevive solo porque
  # `prisma/generar-retos.ts` lo usa para calcular la salida esperada al sembrar
  # los retos derivados. Nunca se despliega.
  #
  # Para usarlo puntualmente:
  #   docker compose --profile herramientas up -d piston
  #   docker compose exec api npx ts-node prisma/generar-retos.ts
  #   docker compose --profile herramientas down piston
  piston:
    profiles: ["herramientas"]
    image: ghcr.io/engineer-man/piston:latest
    container_name: prexi-piston
    privileged: true # Piston requiere aislamiento a nivel de kernel
    ports:
      - "2000:2000"
    environment:
      # Límite de stdout POR ETAPA. El default de Piston (1024 bytes) es
      # diminuto: el visualizador de traza imprime un JSON con los pasos y, con
      # cualquier bucle de más de ~10 iteraciones, se pasa de 1KB → el sandbox
      # mata el proceso con "stdout length exceeded" (SIGKILL, status OL). Lo
      # subimos a 1 MB, suficiente para la traza y para programas normales.
      PISTON_OUTPUT_MAX_SIZE: "1048576"
      # Techo de memoria por ejecución (128 MB) a nivel de servicio, coherente
      # con run_memory_limit del backend.
      PISTON_RUN_MEMORY_LIMIT: "134217728"
      PISTON_COMPILE_MEMORY_LIMIT: "268435456"
    # Acota la memoria del CONTENEDOR del sandbox (defensa en profundidad: el
    # código del alumno nunca puede agotar la RAM del host).
    mem_limit: 1g
    volumes:
      - piston_packages:/piston/packages
    restart: unless-stopped

  api:
    build: ./backend
    container_name: prexi-api
    restart: unless-stopped # vuelve solo tras reiniciar la máquina/Docker
    environment:
      NODE_ENV: development
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://prexi:prexi@db:5432/prexi?schema=public
      # En local no hay pooler: la conexión directa es la misma. En Neon serán
      # dos cadenas distintas (ver backend/.env.example).
      DIRECT_URL: postgresql://prexi:prexi@db:5432/prexi?schema=public
      APP_URL: http://localhost:3000
      # MODO DEMOSTRACIÓN. Vacío = apagado (comportamiento normal: las cuentas
      # sintéticas de `npm run seed:demo` quedan FUERA de todos los cálculos del
      # estudio). Con "1" el rol investigador las INCLUYE, para poder ver las
      # pantallas pobladas y tomar capturas del sistema funcionando:
      #   PREXI_MODO_DEMO=1 docker compose up -d api
      # Con el modo activo el Panel muestra una advertencia roja y el CSV se
      # descarga como "prexi_DEMOSTRACION_NO_ES_EL_ESTUDIO.csv".
      # NUNCA definir esta variable en producción.
      PREXI_MODO_DEMO: ${PREXI_MODO_DEMO:-}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_cambia_en_produccion}
      JWT_EXPIRES_IN: 15m
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-20}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules

  web:
    build: ./frontend
    container_name: prexi-web
    restart: unless-stopped # vuelve solo tras reiniciar la máquina/Docker
    environment:
      # En la red de Docker el frontend habla con el API por su nombre de servicio.
      API_URL: http://api:4000
      # HOT-RELOAD EN WINDOWS: el bind mount no propaga eventos inotify del host a
      # Linux, así que activamos SONDEO (polling) para que Next/webpack detecten los
      # cambios y recompilen sin reiniciar el contenedor a mano.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next

volumes:
  pgdata:
  piston_packages:
  api_node_modules:
  web_node_modules:
  web_next:
