# ════════════════════════════════════════════════════════════
#  PREXI UPEA — Despliegue en un VPS (RUTA ALTERNATIVA)
#
#  ⚠ Esta NO es la ruta de despliegue vigente. La producción de PREXI vive en
#  Render (backend) + Vercel (frontend) + Neon (PostgreSQL), sin VPS y sin
#  coste: ver docs/DESPLIEGUE_RENDER_VERCEL_NEON.md
#
#  Este archivo se conserva por si algún día se quiere auto-hospedar todo en
#  un servidor propio (control total de los datos, sin arranques en frío).
#
#  Uso en el servidor:
#    cp .env.prod.example .env      # edita DOMINIO, JWT_SECRET, GEMINI_API_KEY…
#    docker compose -f docker-compose.prod.yml up -d --build
#
#  Caddy publica HTTPS automático (Let's Encrypt) en https://$DOMINIO y hace de
#  proxy al frontend. NADA más queda expuesto a internet (db y api son
#  internos). El frontend reenvía /api → api internamente.
# ════════════════════════════════════════════════════════════
services:
  db:
    image: postgres:16-alpine
    container_name: prexi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: prexi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prexi}
      POSTGRES_DB: prexi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prexi -d prexi"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    container_name: prexi-api
    restart: unless-stopped
    environment:
      NODE_ENV: production            # activa la cookie httpOnly `secure` (HTTPS)
      PORT: 4000
      CLIENT_ORIGIN: https://${DOMINIO}
      DATABASE_URL: postgresql://prexi:${DB_PASSWORD:-prexi}@db:5432/prexi?schema=public
      DIRECT_URL: postgresql://prexi:${DB_PASSWORD:-prexi}@db:5432/prexi?schema=public
      APP_URL: https://${DOMINIO}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 15m
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-20}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: prexi-web
    restart: unless-stopped
    environment:
      # En la red de Docker el frontend habla con el API por su nombre de servicio.
      API_URL: http://api:4000
    depends_on:
      - api

  # Reverse proxy con HTTPS automático (Let's Encrypt). Único servicio expuesto.
  caddy:
    image: caddy:2-alpine
    container_name: prexi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
